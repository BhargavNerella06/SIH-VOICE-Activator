[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-voice-activator"
version = "0.1.0"
description = "SIH 2026 PS-26172 - Low Latency Voice Activator"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy",
    "soundfile",
    "librosa",
    "resampy",
    "scikit-learn",
    "sounddevice",
    "openwakeword",
    "faster-whisper",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx",
    "coverage",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "voice_separation*",
    "audio_processing*",
    "keyword_spotting*",
    "asr*",
    "command*",
    "api*",
    "voice_pipeline*",
]
exclude = ["tests*", "egs*", "tools*", "structure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
