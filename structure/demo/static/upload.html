<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audio Separation Upload</title>
</head>
<body>
  <h2>Upload mixture for separation</h2>
  <form id="uploadForm" action="/separate" method="post" enctype="multipart/form-data">
    <label>Audio file (WAV): <input type="file" name="file" accept="audio/*" required></label><br><br>
    <label>Method:
      <select name="method">
        <option value="ica">ICA</option>
        <option value="conv_tasnet">Conv-TasNet</option>
      </select>
    </label><br><br>
    <label>Conv-TasNet model path (optional): <input type="text" name="model_path" placeholder="Leave blank for pretrained model"></label><br><br>
    <button type="submit">Upload & Separate</button>
  </form>

  <h3>Detected Speakers: <span id="detectedSpeakers">-</span></h3>
  <h3>Result</h3>
  <pre id="result"></pre>
  <div id="downloads"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const result = document.getElementById('result');
    const detectedSpeakers = document.getElementById('detectedSpeakers');
    const downloads = document.getElementById('downloads');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = 'Uploading...';
      detectedSpeakers.textContent = '-';
      downloads.innerHTML = '';
      const fd = new FormData(form);
      try {
        const resp = await fetch('/separate', { method: 'POST', body: fd });
        const json = await resp.json();
        if (json.detected_speakers !== undefined) {
          detectedSpeakers.textContent = String(json.detected_speakers);
        }
        result.textContent = JSON.stringify(json, null, 2);
        if (json.outputs) {
          json.outputs.forEach(o => {
            const a = document.createElement('a');
            a.href = '/download?path=' + encodeURIComponent(o.path);
            a.textContent = 'Download ' + o.name;
            a.style.display = 'block';
            downloads.appendChild(a);
          });
        }
      } catch (err) {
        result.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
